upstream section_svc {
    server section-svc:3000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 现场照片最大 10M，留点余量
    client_max_body_size 12m;

    # 接口反代到 section-svc
    location /api/ {
        proxy_pass http://section_svc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 照片文件也由 section-svc 出（它有 uploads 卷）
    location /uploads/ {
        proxy_pass http://section_svc;
        proxy_set_header Host $host;
    }

    # 其余全部走 React 单页
    location / {
        try_files $uri $uri/ /index.html;
    }
}
